<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe-Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-2xl px-6 py-12">
      <header class="space-y-2">
        <h1 class="text-3xl font-semibold tracking-tight">Vibe-Weather</h1>
        <p class="text-slate-300">
          City:
          <span class="font-medium text-slate-100" id="city-name">{{ city_name }}</span>
        </p>
      </header>

      <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900/40 p-6 shadow-xl shadow-black/30">
        {% if error %}
          <div class="rounded-xl border border-rose-900/60 bg-rose-950/40 p-4">
            <p class="font-medium text-rose-200">Weather unavailable</p>
            <p class="mt-1 text-sm text-rose-200/80" id="error-message">{{ error }}</p>
          </div>
        {% else %}
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
              <p class="text-sm text-slate-400">Temperature</p>
              <p class="mt-1 text-4xl font-semibold" id="weather-temp">
                {{ temperature_c }}<span class="text-2xl text-slate-300">°C</span>
              </p>
            </div>
            <div>
              <p class="text-sm text-slate-400">Vibe</p>
              <p class="mt-1 text-2xl font-semibold" id="weather-vibe">{{ vibe }}</p>
              <p class="mt-1 text-sm text-slate-400">
                Wind:
                <span class="text-slate-200" id="weather-wind">{{ wind_kph }} km/h</span>
              </p>
            </div>
          </div>

          <div class="mt-6 border-t border-slate-800 pt-4 text-sm text-slate-400">
            <p>
              Data time:
              <span class="text-slate-200" id="weather-time">{{ weather_time }}</span>
            </p>
          </div>
        {% endif %}
      </section>

      <footer class="mt-10 text-xs text-slate-500">
        <p>
          Last render:
          <span id="update-time" class="text-slate-300">{{ render_time }}</span>
        </p>
        <p class="mt-2">
          Powered by <span class="text-slate-300">Open-Meteo</span>.
        </p>
      </footer>
    </main>
  </body>
</html>
